[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewer2"
version = "2.0.0"
description = "Adversarial review of academic PDFs, powered by Google Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "The Catalogue of Errors Ltd"}]
keywords = ["peer-review", "llm", "gemini", "academic", "pdf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
]
dependencies = [
    "google-genai",
    "pypdf",
    "requests",
    "reportlab",
    "python-docx",
]

[project.optional-dependencies]
# PyMuPDF is AGPL-3.0 licensed; it is optional. It shrinks PDFs over Gemini's
# 50 MB upload limit and gives slightly better page-number scans.
pdf = [
    "PyMuPDF",
    "pillow",
]
deepseek = [
    "openai",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
reviewer2 = "reviewer2.cli:main"

[project.urls]
Homepage = "https://github.com/isitcredible/reviewer2"
Issues = "https://github.com/isitcredible/reviewer2/issues"
Source = "https://github.com/isitcredible/reviewer2"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reviewer2 = [
    "prompts/*.txt",
    "prompts/resources/*.txt",
    "prompts/resources/*.pdf",
    "data/*.csv",
]
